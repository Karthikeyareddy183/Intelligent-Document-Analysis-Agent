version: "3.8"

services:
  # ── FastAPI Backend ────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: doc-agent-api
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/data/uploads
      - processed_data:/app/data/processed
      - chroma_data:/app/data/chroma_db
      - hf_cache:/home/appuser/.cache/huggingface
    env_file:
      - ../.env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  # ── Streamlit Frontend ─────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: doc-agent-ui
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
        "--server.headless",
        "true",
      ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  upload_data:
    driver: local
  processed_data:
    driver: local
  chroma_data:
    driver: local
  hf_cache:
    driver: local
