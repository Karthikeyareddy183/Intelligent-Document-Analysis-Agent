version: "3.8"

services:
  # ── Development API with hot-reload ─────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: doc-agent-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - /app/__pycache__
      - hf_cache:/root/.cache/huggingface
    env_file:
      - ../.env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - LOG_LEVEL=DEBUG

  # ── Streamlit Frontend ─────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: doc-agent-ui-dev
    ports:
      - "8501:8501"
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
        "--server.headless",
        "true",
      ]

volumes:
  hf_cache:
    driver: local
