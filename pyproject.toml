[project]
name = "intelligent-doc-agent"
version = "1.0.0"
description = "Multi-Agent RAG System with Computer Vision Integration"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116", "R0903"]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
