process_document_task:
  description: >
    Process the uploaded document at path: {file_path}

    Steps:
    1. Detect file type (PDF or image)
    2. For PDFs: extract text page by page using pdf_extractor tool
    3. For images: run OCR using ocr_extractor tool
    4. Detect tables using table_chart_detector tool
    5. Record page numbers and section titles

    Return all extracted content as structured JSON.
  agent: document_processor
  expected_output: >
    A JSON object containing:
    - total_pages: int
    - pages: list with page_number, text, tables, images for each page

index_document_task:
  description: >
    Index the processed document content into the vector database.

    Document ID: {document_id}
    Filename: {filename}

    Steps:
    1. Collect all text content from processed pages
    2. Use embedding_indexer tool to generate embeddings and store them
    3. Verify the indexing was successful

    Use the content provided by the Document Processor.
  agent: retrieval_specialist
  expected_output: >
    A JSON object with:
    - document_id: string
    - chunks_indexed: int
    - status: "success" or "error"

retrieve_context_task:
  description: >
    Find the most relevant document chunks for this query: {query}
    Document filter: {document_id}

    Steps:
    1. Use vector_search tool with the query
    2. Return the top results with their text and metadata
  agent: retrieval_specialist
  expected_output: >
    A list of relevant document chunks with text, page numbers,
    and relevance scores.

analyze_and_answer_task:
  description: >
    Answer this user question: {query}

    Use the retrieved context to generate an accurate answer.

    Steps:
    1. Review the retrieved document chunks
    2. Use llm_analyzer tool to generate the answer
    3. Include citations with page numbers
    4. Provide a confidence score
  agent: analysis_expert
  expected_output: >
    A JSON object with:
    - answer: string
    - confidence: float (0.0-1.0)
    - sources: list of citation objects
